[project]
name = "splunk-rest-extractor"
version = "0.1.0"
description = "Extract every event an SPL search returns over Splunk REST (8089) into date-named flat files, with completeness validation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tzdata>=2026.3 ; sys_platform == 'win32'",
]

[project.scripts]
splunk-extract = "splunk_rest_extractor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splunk_rest_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
